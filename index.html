<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hub AG7 · réseaux sociaux</title>
    <!-- Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ---------- Base ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c0f;
            overflow-x: hidden;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        .banner {
            width: 100%;
            height: 100vh;
            text-align: center;
            overflow: hidden;
            position: relative;
            background: radial-gradient(circle at center, #1a1f2c 0%, #0b0e14 100%);
        }

        /* ---------- Slider 3D (exactement comme l'exemple) ---------- */
        .banner .slider {
            position: absolute;
            width: 240px;
            height: 280px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transform-style: preserve-3d;
            transform: perspective(1000px);
            animation: autoRun 25s linear infinite;
            z-index: 2;
        }

        @keyframes autoRun {
            from {
                transform: perspective(1000px) rotateX(-10deg) rotateY(0deg);
            }
            to {
                transform: perspective(1000px) rotateX(-10deg) rotateY(360deg);
            }
        }

        .banner .slider .item {
            position: absolute;
            inset: 0;
            transform: rotateY(calc((var(--position) - 1) * (360 / var(--quantity)) * 1deg)) translateZ(550px);
            border-radius: 24px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s;
        }

        /* Style des cartes réseau social */
        .card {
            width: 100%;
            height: 100%;
            background: rgba(20, 25, 35, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(100, 150, 255, 0.3);
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(120,180,255,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            color: white;
            transition: all 0.2s ease;
            will-change: transform;
        }

        .card i {
            font-size: 3.5rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 8px currentColor);
        }

        .card .network-name {
            font-weight: 700;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #fff, #b0c4ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .card .handle {
            font-size: 0.85rem;
            background: rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Couleurs des icônes */
        .card[data-network="facebook"] i { color: #1877f2; }
        .card[data-network="instagram"] i { color: #e4405f; }
        .card[data-network="tiktok"] i { color: #ffffff; text-shadow: 0 0 8px #69c9d0; }
        .card[data-network="linkedin"] i { color: #0a66c2; }
        .card[data-network="telegram"] i { color: #26a5e4; }
        .card[data-network="x"] i { color: #ffffff; }
        .card[data-network="whatsapp"] i { color: #25d366; }
        .card[data-network="github"] i { color: #f5f5f5; }
        .card[data-network="email"] i { color: #ea4335; }
        .card[data-network="threads"] i { color: #ffffff; }
        .card[data-network="pinterest"] i { color: #c8232c; }

        /* Effet hover (zoom léger) */
        .banner .slider .item:hover {
            transform: rotateY(calc((var(--position) - 1) * (360 / var(--quantity)) * 1deg)) translateZ(580px) scale(1.02);
            z-index: 10;
        }

        /* ---------- Responsive : mobile ---------- */
        @media (max-width: 768px) {
            .banner .slider {
                width: 140px;
                height: 170px;
                top: 35%;
                transform: translate(-50%, 0);
            }
            .banner .slider .item {
                transform: rotateY(calc((var(--position) - 1) * (360 / var(--quantity)) * 1deg)) translateZ(320px);
            }
            .card {
                padding: 12px;
            }
            .card i {
                font-size: 2rem;
                margin-bottom: 8px;
            }
            .card .network-name {
                font-size: 0.9rem;
            }
            .card .handle {
                font-size: 0.6rem;
                padding: 3px 8px;
            }
            @keyframes autoRun {
                from { transform: perspective(800px) rotateX(-6deg) rotateY(0deg); }
                to   { transform: perspective(800px) rotateX(-6deg) rotateY(360deg); }
            }
        }

        /* ---------- Texte d'information ---------- */
        .info {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 0.8rem;
            z-index: 10;
            pointer-events: none;
            font-family: monospace;
        }
    </style>
</head>
<body>
<div class="banner">
    <!-- Slider circulaire 3D : 11 cartes -->
    <div class="slider" style="--quantity: 11">
        <!-- Facebook -->
        <div class="item" style="--position: 1">
            <div class="card" data-network="facebook" data-link="https://www.facebook.com/profile.php?id=100077852277023">
                <i class="fab fa-facebook"></i>
                <span class="network-name">Facebook</span>
                <span class="handle">@agape_ag7</span>
            </div>
        </div>
        <!-- Instagram -->
        <div class="item" style="--position: 2">
            <div class="card" data-network="instagram" data-link="https://www.instagram.com/agap_mh?igsh=Zm04OGFkNmliMHJq">
                <i class="fab fa-instagram"></i>
                <span class="network-name">Instagram</span>
                <span class="handle">@agap_mh</span>
            </div>
        </div>
        <!-- TikTok -->
        <div class="item" style="--position: 3">
            <div class="card" data-network="tiktok" data-link="https://tiktok.com/@ag7_fx">

                <span class="network-name">TikTok</span>
                <span class="handle">@ag7_fx</span>
            </div>
        </div>
        <!-- LinkedIn -->
        <div class="item" style="--position: 4">
            <div class="card" data-network="linkedin" data-link="https://www.linkedin.com/in/agape-ag7-9605bb378">
                <i class="fab fa-linkedin"></i>

        </div>
        <!-- Telegram -->
        <div class="item" style="--position: 5">

        </div>
        <!-- X (Twitter) -->
        <div class="item" style="--position: 6">

        </div>
        <!-- WhatsApp -->
        <div class="item" style="--position: 7">
            <div class="card" data-network="whatsapp" data-link="https://wa.me/254106097625">
                <i class="fab fa-whatsapp"></i>
                <span class="network-name">WhatsApp</span>
                <span class="handle">+254106097625</span>
            </div>
        </div>
        <!-- GitHub -->
        <div class="item" style="--position: 8">
            <div class="card" data-network="github" data-link="https://github.com/Agapeag7">
                <i class="fab fa-github"></i>
                <span class="network-name">GitHub</span>
                <span class="handle">@ag7</span>
            </div>
        </div>
        <!-- Email -->
        <div class="item" style="--position: 9">
            <div class="card" data-network="email" data-link="mailto:agapeag7@gmail.com">
                <i class="fas fa-envelope"></i>
                <span class="network-name">Email</span>
                <span class="handle">agapeag7@gmail.com</span>
            </div>
        </div>
        <!-- Threads -->
        <div class="item" style="--position: 10">
            <div class="card" data-network="threads" data-link="https://www.threads.com/@agap_mh">
                <i class="fab fa-threads"></i>
                <span class="network-name">Threads</span>
                <span class="handle">@agap_mh</span>
            </div>
        </div>
        <!-- Pinterest -->
        <div class="item" style="--position: 11">
            <div class="card" data-network="pinterest" data-link="https://pin.it/1SHyVValE">
                <i class="fab fa-pinterest"></i>
                <span class="network-name">Pinterest</span>
                <span class="handle">@ag7</span>
            </div>
        </div>
    </div>

    <!-- Petit texte informatif -->
    <div class="info">↻ rotation automatique | cliquez sur une carte ↻</div>
</div>

<script>
    // Gestion des clics sur les cartes
    document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', (e) => {
            e.stopPropagation();
            const link = card.getAttribute('data-link');
            if (link) {
                // petite animation visuelle
                card.style.transform = 'scale(0.97)';
                setTimeout(() => {
                    card.style.transform = '';
                }, 150);
                setTimeout(() => {
                    window.open(link, '_blank');
                }, 100);
            }
        });
    });
</script>
</body>
</html>
