<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hub AG7 · réseaux sociaux</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="website icon" type="png" href="ico/AG7.png">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div id="scene-container"></div>
    <div class="loading">✨ rotation continue ✨</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { CSS3DRenderer, CSS3DObject } from 'https://unpkg.com/three@0.128.0/examples/jsm/renderers/CSS3DRenderer.js';

        // --- Liste des réseaux (inchangée) ---
        const CARDS = [
            { network: 'facebook',   icon: 'fab fa-facebook',   handle: '@agape_ag7',   link: 'https://www.facebook.com/profile.php?id=100077852277023', color: '#1877f2' },
            { network: 'instagram',  icon: 'fab fa-instagram',  handle: '@agap_mh',   link: 'https://www.instagram.com/agap_mh?igsh=Zm04OGFkNmliMHJq', color: '#e4405f' },
            { network: 'tiktok',     icon: 'fab fa-tiktok',     handle: '@ag7_fx',   link: 'https://tiktok.com/@ag7_fx', color: '#ffffff' },
            { network: 'linkedin',   icon: 'fab fa-linkedin',   handle: '@agape_ag7',   link: 'https://www.linkedin.com/in/agape-ag7-9605bb378?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=android_app', color: '#0a66c2' },
            { network: 'telegram',   icon: 'fab fa-telegram',   handle: '@ag7_mhy',   link: 'https://t.me/Ag7_mhy', color: '#26a5e4' },
            { network: 'x',          icon: 'fab fa-x-twitter',  handle: '@AgapeAg7', link: 'https://x.com/AgapeAg7', color: '#000000' },
            { network: 'whatsapp',   icon: 'fab fa-whatsapp',   handle: '+254106097625', link: 'https://wa.me/254106097625', color: '#25d366' },
            { network: 'github',     icon: 'fab fa-github',     handle: '@ag7',      link: 'https://github.com/Agapeag7', color: '#f5f5f5' },
            { network: 'email',      icon: 'fas fa-envelope',   handle: 'agapeag7@gmail.com', link: 'mailto:agapeag7@gmail.com', color: '#ea4335' },
            { network: 'threads',    icon: 'fab fa-threads',    handle: '@agap_mh',  link: 'https://www.threads.com/@agap_mh', color: '#1d1d1d' },
            { network: 'pinterest',  icon: 'fab fa-pinterest',  handle: '@ag7',  link: 'https://pin.it/1SHyVValE', color: '#c8232c' }
        ];

        // --- Configuration du cercle ---
        const RADIUS = 480;          // Rayon du cercle (distance au centre)
        const CARD_COUNT = CARDS.length;
        
        // Variables Three.js
        let scene, camera, renderer;
        let cardGroup;               // Groupe qui va tourner
        let cardObjects = [];

        // --- Initialisation ---
        function init() {
            scene = new THREE.Scene();
            
            // Caméra : position légèrement surélevée et reculée
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(0, 120, 1100);
            camera.lookAt(0, 0, 0);
            
            renderer = new CSS3DRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.domElement.style.position = 'fixed';
            renderer.domElement.style.top = '0';
            renderer.domElement.style.left = '0';
            renderer.domElement.style.pointerEvents = 'auto';
            document.getElementById('scene-container').appendChild(renderer.domElement);
            
            // Groupe principal (tournera)
            cardGroup = new THREE.Group();
            scene.add(cardGroup);
            
            createCardsOnCircle();
            
            animate();
        }
        
        // --- Création des cartes disposées en cercle ---
        function createCardsOnCircle() {
            CARDS.forEach((item, index) => {
                // Création de la div (identique à l'original)
                const div = document.createElement('div');
                div.className = 'card';
                div.setAttribute('data-network', item.network);
                div.setAttribute('data-link', item.link);
                div.setAttribute('data-index', index);
                div.innerHTML = `
                    <i class="${item.icon}"></i>
                    <span class="network-name">${item.network.charAt(0).toUpperCase() + item.network.slice(1)}</span>
                    <span class="handle">${item.handle}</span>
                `;
                
                // Clic
                div.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const link = div.getAttribute('data-link');
                    div.style.transform = 'scale(0.95) translateZ(-30px)';
                    setTimeout(() => {
                        div.style.transform = '';
                    }, 150);
                    setTimeout(() => {
                        window.open(link, '_blank');
                    }, 100);
                });
                
                // Effet tilt au survol (conservé)
                let tiltRequest = null;
                div.addEventListener('mousemove', (e) => {
                    if (window.innerWidth < 768) return;
                    const rect = div.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotX = (y - centerY) / centerY * 8;
                    const rotY = (centerX - x) / centerX * 8;
                    if (tiltRequest) cancelAnimationFrame(tiltRequest);
                    tiltRequest = requestAnimationFrame(() => {
                        div.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.02)`;
                        tiltRequest = null;
                    });
                });
                div.addEventListener('mouseleave', () => {
                    if (tiltRequest) cancelAnimationFrame(tiltRequest);
                    tiltRequest = null;
                    div.style.transform = '';
                });
                
                // --- Position sur le cercle ---
                const angle = (index / CARD_COUNT) * Math.PI * 2;
                const x = Math.cos(angle) * RADIUS;
                const z = Math.sin(angle) * RADIUS;
                const y = 0; // toutes à la même hauteur (on peut ajouter une légère inclinaison si souhaité)
                
                const cssObj = new CSS3DObject(div);
                cssObj.position.set(x, y, z);
                // Faire face au centre : regarder vers (0,0,0)
                cssObj.lookAt(0, y, 0);
                
                cardGroup.add(cssObj);
                cardObjects.push(cssObj);
            });
        }
        
        // --- Animation : rotation continue du groupe ---
        let rotationSpeed = 0.005;    // radians par frame (~0.3 rad/s à 60fps) → tour complet en ~20s
        let autoRotate = true;
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (autoRotate) {
                cardGroup.rotation.y += rotationSpeed;
            }
            
            // Petit effet de parallax sur la caméra (optionnel)
            // camera.position.x += (0 - camera.position.x) * 0.05;
            
            renderer.render(scene, camera);
        }
        
        // --- Gestion du redimensionnement ---
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (window.innerWidth < 768) {
                camera.position.z = 950;
            } else {
                camera.position.z = 1100;
            }
        }
        
        // --- Fond à particules (inchangé) ---
        function initBackground() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            
            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                initParticles();
            }
            
            function initParticles() {
                particles = [];
                const count = 45;
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        size: Math.random() * 2 + 1,
                        speed: 0.02 + Math.random() * 0.03,
                        color: `rgba(100, 150, 255, ${0.2 + Math.random()*0.3})`
                    });
                }
            }
            
            function animateBg() {
                ctx.clearRect(0, 0, width, height);
                const gradient = ctx.createLinearGradient(0, 0, width, height);
                gradient.addColorStop(0, '#0b0e14');
                gradient.addColorStop(1, '#1a1f2c');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);
                
                particles.forEach(p => {
                    p.y += p.speed * 0.5;
                    if (p.y > height) p.y = 0;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.shadowColor = '#00a6ff';
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
                setTimeout(() => requestAnimationFrame(animateBg), 1000 / 30);
            }
            
            window.addEventListener('resize', resize);
            resize();
            animateBg();
        }
        
        // --- Lancement ---
        window.addEventListener('load', () => {
            initBackground();
            init();
            window.addEventListener('resize', onResize);
            
            // Option : arrêter la rotation au survol de la zone (décommentez si voulu)
            // const container = document.getElementById('scene-container');
            // container.addEventListener('mouseenter', () => autoRotate = false);
            // container.addEventListener('mouseleave', () => autoRotate = true);
        });
    </script>
</body>
</html>
