<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hub AG7 · réseaux sociaux</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="website icon" type="png" href="ico/AG7.png">
    <style>
        /* Responsive des cartes */
        @media (max-width: 768px) {
            .card {
                width: 160px !important;
                height: 190px !important;
                padding: 12px !important;
            }
            .card i {
                font-size: 2.5rem !important;
                margin-bottom: 10px;
            }
            .card .network-name {
                font-size: 1.2rem !important;
            }
            .card .handle {
                font-size: 0.75rem !important;
                padding: 4px 8px;
            }
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div id="scene-container"></div>
    <div class="loading">↻ scroll / swipe ↻</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { CSS3DRenderer, CSS3DObject } from 'https://unpkg.com/three@0.128.0/examples/jsm/renderers/CSS3DRenderer.js';

        // --- 11 réseaux ---
        const CARDS = [
            { network: 'facebook',   icon: 'fab fa-facebook',   handle: '@agape_ag7',   link: 'https://www.facebook.com/profile.php?id=100077852277023', color: '#1877f2' },
            { network: 'instagram',  icon: 'fab fa-instagram',  handle: '@agap_mh',     link: 'https://www.instagram.com/agap_mh?igsh=Zm04OGFkNmliMHJq', color: '#e4405f' },
            { network: 'tiktok',     icon: 'fab fa-tiktok',     handle: '@ag7_fx',     link: 'https://tiktok.com/@ag7_fx', color: '#ffffff' },
            { network: 'linkedin',   icon: 'fab fa-linkedin',   handle: '@agape_ag7',  link: 'https://www.linkedin.com/in/agape-ag7-9605bb378', color: '#0a66c2' },
            { network: 'telegram',   icon: 'fab fa-telegram',   handle: '@ag7_mhy',    link: 'https://t.me/Ag7_mhy', color: '#26a5e4' },
            { network: 'x',          icon: 'fab fa-x-twitter',  handle: '@AgapeAg7',   link: 'https://x.com/AgapeAg7', color: '#000000' },
            { network: 'whatsapp',   icon: 'fab fa-whatsapp',   handle: '+254106097625', link: 'https://wa.me/254106097625', color: '#25d366' },
            { network: 'github',     icon: 'fab fa-github',     handle: '@ag7',        link: 'https://github.com/Agapeag7', color: '#f5f5f5' },
            { network: 'email',      icon: 'fas fa-envelope',   handle: 'agapeag7@gmail.com', link: 'mailto:agapeag7@gmail.com', color: '#ea4335' },
            { network: 'threads',    icon: 'fab fa-threads',    handle: '@agap_mh',    link: 'https://www.threads.com/@agap_mh', color: '#1d1d1d' },
            { network: 'pinterest',  icon: 'fab fa-pinterest',  handle: '@ag7',        link: 'https://pin.it/1SHyVValE', color: '#c8232c' }
        ];

        let scene, camera, renderer;
        let cardGroup;
        let cardObjects = [];

        // Paramètres responsives
        let currentRadius = 480;
        let cameraZ = 1100;
        let cameraY = 120;

        // Gestion de la rotation (inertie)
        let targetRotationY = 0;
        let currentRotationY = 0;
        let wheelVelocity = 0;
        const FRICTION = 0.93;
        const WHEEL_FACTOR = 0.008;
        const TOUCH_FACTOR = 0.012;

        function updateResponsive() {
            const isMobile = window.innerWidth < 768;
            if (isMobile) {
                currentRadius = 280;
                cameraZ = 700;
                cameraY = 50;
            } else {
                currentRadius = 480;
                cameraZ = 1100;
                cameraY = 120;
            }
        }

        function init() {
            scene = new THREE.Scene();
            updateResponsive();
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 5000);
            camera.position.set(0, cameraY, cameraZ);
            camera.lookAt(0, 0, 0);
            
            renderer = new CSS3DRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.domElement.style.position = 'fixed';
            renderer.domElement.style.top = '0';
            renderer.domElement.style.left = '0';
            renderer.domElement.style.pointerEvents = 'auto';
            document.getElementById('scene-container').appendChild(renderer.domElement);
            
            cardGroup = new THREE.Group();
            scene.add(cardGroup);
            
            createCardsOnCircle();
            animate();
            
            // Événements
            window.addEventListener('wheel', onWheel, { passive: false });
            window.addEventListener('resize', onResize);
            
            // Gestion tactile
            let touchStartX = 0;
            let touchMoved = false;
            window.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchMoved = false;
            });
            window.addEventListener('touchmove', (e) => {
                if (touchStartX === undefined) return;
                e.preventDefault();
                const dx = e.touches[0].clientX - touchStartX;
                if (Math.abs(dx) > 5) touchMoved = true;
                const delta = dx * TOUCH_FACTOR;
                targetRotationY += delta;
                wheelVelocity = delta / 2;
                touchStartX = e.touches[0].clientX;
            });
            window.addEventListener('touchend', () => {
                touchStartX = undefined;
            });
        }
        
        function createCardsOnCircle() {
            const count = CARDS.length;
            CARDS.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.setAttribute('data-network', item.network);
                div.setAttribute('data-link', item.link);
                div.setAttribute('data-index', index);
                div.innerHTML = `
                    <i class="${item.icon}"></i>
                    <span class="network-name">${item.network.charAt(0).toUpperCase() + item.network.slice(1)}</span>
                    <span class="handle">${item.handle}</span>
                `;
                
                div.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const link = div.getAttribute('data-link');
                    div.style.transform = 'scale(0.95) translateZ(-30px)';
                    setTimeout(() => { div.style.transform = ''; }, 150);
                    setTimeout(() => { window.open(link, '_blank'); }, 100);
                });
                
                // Tilt desktop uniquement
                if (window.innerWidth >= 768) {
                    let tiltRequest = null;
                    div.addEventListener('mousemove', (e) => {
                        const rect = div.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;
                        const centerX = rect.width/2;
                        const centerY = rect.height/2;
                        const rotX = (y - centerY)/centerY * 8;
                        const rotY = (centerX - x)/centerX * 8;
                        if (tiltRequest) cancelAnimationFrame(tiltRequest);
                        tiltRequest = requestAnimationFrame(() => {
                            div.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.02)`;
                            tiltRequest = null;
                        });
                    });
                    div.addEventListener('mouseleave', () => {
                        if (tiltRequest) cancelAnimationFrame(tiltRequest);
                        tiltRequest = null;
                        div.style.transform = '';
                    });
                }
                
                const angle = (index / count) * Math.PI * 2;
                const x = Math.cos(angle) * currentRadius;
                const z = Math.sin(angle) * currentRadius;
                const cssObj = new CSS3DObject(div);
                cssObj.position.set(x, 0, z);
                cssObj.lookAt(0, 0, 0);
                cardGroup.add(cssObj);
                cardObjects.push(cssObj);
            });
        }
        
        function onWheel(e) {
            e.preventDefault();
            const delta = e.deltaY * WHEEL_FACTOR;
            wheelVelocity += delta;
            targetRotationY += delta;
            // Limites de vélocité
            wheelVelocity = Math.max(-0.5, Math.min(0.5, wheelVelocity));
        }
        
        function onResize() {
            updateResponsive();
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.position.set(0, cameraY, cameraZ);
            camera.lookAt(0, 0, 0);
            // Reconstruire le cercle si le rayon a changé
            if (cardGroup && currentRadius !== cardGroup.userData?.lastRadius) {
                while(cardGroup.children.length) cardGroup.remove(cardGroup.children[0]);
                cardObjects = [];
                createCardsOnCircle();
                cardGroup.userData = { lastRadius: currentRadius };
            } else if (!cardGroup.userData) {
                cardGroup.userData = { lastRadius: currentRadius };
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Inertie
            if (Math.abs(wheelVelocity) > 0.001) {
                targetRotationY += wheelVelocity;
                wheelVelocity *= FRICTION;
            }
            
            // Interpolation douce pour suivre la cible
            currentRotationY += (targetRotationY - currentRotationY) * 0.12;
            cardGroup.rotation.y = currentRotationY;
            
            renderer.render(scene, camera);
        }
        
        // --- Fond à particules ---
        function initBackground() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            
            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                particles = [];
                for (let i = 0; i < 45; i++) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        size: Math.random() * 2 + 1,
                        speed: 0.02 + Math.random() * 0.03,
                        color: `rgba(100, 150, 255, ${0.2 + Math.random()*0.3})`
                    });
                }
            }
            
            function animateBg() {
                ctx.clearRect(0, 0, width, height);
                const gradient = ctx.createLinearGradient(0, 0, width, height);
                gradient.addColorStop(0, '#0b0e14');
                gradient.addColorStop(1, '#1a1f2c');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, width, height);
                
                particles.forEach(p => {
                    p.y += p.speed * 0.5;
                    if (p.y > height) p.y = 0;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.shadowColor = '#00a6ff';
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
                setTimeout(() => requestAnimationFrame(animateBg), 1000/30);
            }
            
            window.addEventListener('resize', resize);
            resize();
            animateBg();
        }
        
        window.addEventListener('load', () => {
            initBackground();
            init();
        });
    </script>
</body>
</html>
